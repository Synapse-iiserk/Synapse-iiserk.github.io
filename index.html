<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/ifinn_logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>iFINN | A quantitative terminal you can audit</title>
  <meta name="title" content="iFINN | A quantitative terminal you can audit" />
  <meta name="description"
    content="528 vetted algorithms, walk-forward backtesting, paper trading, 22+ market data providers and a research agent with 145 live tools. Every number traceable to an algorithm or a tool call. Built by Team iFINN, IISER Kolkata." />
  <meta name="keywords"
    content="quantitative finance, algorithmic trading platform, backtesting, paper trading, AI trading agent, financial analytics, iFINN, NSE, BSE, crypto analytics, machine learning finance, IISER Kolkata" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ifinn.org/" />
  <meta property="og:title" content="iFINN | A quantitative terminal you can audit" />
  <meta property="og:description" content="528 vetted algorithms, honest backtesting, paper trading, cross-asset market data and a research agent that answers with live tool calls." />
  <meta property="og:image" content="https://ifinn.org/og-image.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://ifinn.org/" />
  <meta property="twitter:title" content="iFINN | A quantitative terminal you can audit" />
  <meta property="twitter:description" content="528 vetted algorithms, honest backtesting, paper trading, cross-asset market data and a research agent that answers with live tool calls." />
  <meta property="twitter:image" content="https://ifinn.org/og-image.png" />

  <!-- Theme -->
  <meta name="theme-color" content="#0a0e0c" />
  <meta name="color-scheme" content="dark" />

  <!-- SPA redirect: restore URL from 404.html redirect -->
  <script>
    (function() {
      var p = window.location.search && decodeURIComponent(window.location.search.slice(3));
      if (p) { window.history.replaceState(null, null, p); }
    })();
  </script>

  <!-- Preconnect to external fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Type system: Space Grotesk (display) + Archivo (body) + IBM Plex Mono (data) -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
