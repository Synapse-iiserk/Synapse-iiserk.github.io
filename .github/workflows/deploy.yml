name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # The .nojekyll marker is what stops GitHub Pages from republishing the
      # source tree over the build. It must exist in the input and survive
      # into the output; assert that here, where both are on disk.
      - name: Verify build output
        run: npm run audit:build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # The verification script lives in the repository, so the deploy job
      # needs a checkout to run it.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # The site once published the repository's own index.html, which loads
      # /src/main.tsx, while every build step reported success. Verify what
      # was actually published before calling the deploy done.
      - name: Verify the published site
        run: npm run audit:deploy
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
